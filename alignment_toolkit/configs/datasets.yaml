version: 1

datasets:
  ultrachat_sft:
    adapter: hf_instruction
    kind: instruction
    source:
      type: huggingface
      id: HuggingFaceH4/ultrachat_200k
      config: default
      split: train_sft

  ultrachat_prompts:
    adapter: hf_prompt
    kind: prompt
    source:
      type: huggingface
      id: HuggingFaceH4/ultrachat_200k
      config: default
      split: train_gen

  ultrafeedback_dpo:
    adapter: hf_preference
    kind: preference
    source:
      type: huggingface
      id: HuggingFaceH4/ultrafeedback_binarized
      config: default
      split: train_prefs

  pku_saferlhf:
    adapter: hf_safety_preference
    kind: preference
    source:
      type: huggingface
      id: PKU-Alignment/PKU-SafeRLHF
      config: default
      split: train
