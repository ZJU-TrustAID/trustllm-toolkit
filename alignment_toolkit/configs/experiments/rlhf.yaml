version: 1

models:
  base:
    source: huggingface
    id: Qwen/Qwen2.5-7B-Instruct
    revision: main
    cache_dir: .cache/huggingface

datasets:
  ultrachat_sft:
    adapter: hf_instruction
    kind: instruction
    source:
      type: huggingface
      id: HuggingFaceH4/ultrachat_200k
      config: default
      split: train_sft
    mapping:
      messages: messages
  ultrafeedback_dpo:
    adapter: hf_preference
    kind: preference
    source:
      type: huggingface
      id: HuggingFaceH4/ultrafeedback_binarized
      config: default
      split: train_prefs
    mapping:
      prompt: prompt
      chosen: chosen
      rejected: rejected
  ultrachat_prompts:
    adapter: hf_prompt
    kind: prompt
    source:
      type: huggingface
      id: HuggingFaceH4/ultrachat_200k
      config: default
      split: train_gen
    mapping:
      prompt: prompt
      messages: messages

pipeline:
  name: rlhf
  stages:
    - id: sft
      method:
        name: sft
        backend: trl
      model: base
      dataset:
        name: ultrachat_sft

    - id: reward_model
      method:
        name: reward_model
        backend: trl
      model: sft
      dataset:
        name: ultrafeedback_dpo
      input:
        model: sft
      training:
        lora:
          r: 16
          lora_alpha: 32
          lora_dropout: 0.05
          target_modules: [q_proj, k_proj, v_proj, o_proj]
          modules_to_save: [score]
        merge_lora: true

    - id: ppo
      method:
        name: ppo
        backend: trl
      policy: sft
      reward_model: reward_model
      dataset:
        name: ultrachat_prompts
      input:
        policy: sft
        reward_model: reward_model
      training:
        lora:
          r: 16
          lora_alpha: 32
          lora_dropout: 0.05
          target_modules: [q_proj, k_proj, v_proj, o_proj]
        adapter_disabled: true

evaluation:
  profile: safety_alignment
  model:
    stage: ppo
  suites:
    - name: harmbench
      backend: refusal_heuristic
      source: {type: huggingface, id: walledai/HarmBench, split: test}
      prompt_field: prompt
    - name: strongreject
      backend: refusal_heuristic
      source: {type: huggingface, id: walledai/StrongREJECT, split: test}
      prompt_field: prompt
    - name: jailbreakbench
      backend: refusal_heuristic
      source: {type: huggingface, id: JailbreakBench/JBB-Behaviors, split: test}
      prompt_field: Goal
    - name: xstest
      backend: refusal_heuristic
      source: {type: huggingface, id: walledai/XSTest, split: test}
      prompt_field: prompt
      label_field: label

output:
  root: models
  collision: error
