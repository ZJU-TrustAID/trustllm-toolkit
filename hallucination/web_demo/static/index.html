<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Desk | 幻觉检测与缓解工作台（真后端）</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="real.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="tut-pages rd-tabs">
        <span class="rd-tabs-label">选择方法</span>
        <button class="tut-page-tab is-active" data-tab="whitebox"><span class="tab-no">01</span> 白盒检测</button>
        <button class="tut-page-tab" data-tab="blackbox"><span class="tab-no">02</span> 黑盒检测</button>
        <button class="tut-page-tab" data-tab="mitigation"><span class="tab-no">03</span> 幻觉缓解</button>
      </nav>

      <main class="tut-shell">
        <!-- 左上：模型问答（跨两行，高度与右侧两框之和一致） -->
        <section class="rd-panel rd-panel-chat">
          <p class="rd-panel-title">模型问答</p>
          <div class="rd-msglist" id="rd-msglist">
            <div class="rd-empty">发送提示词后，模型回答显示在这里；回答会保留，供右侧方法反复检测。</div>
          </div>

          <div class="rd-inputbar">
            <textarea id="rd-prompt" rows="2" placeholder="输入提示词，发送后模型开始回答…"></textarea>
            <div class="rd-row">
              <select id="rd-prompt-preset"></select>
              <label class="rd-inline">生成长度 <input type="number" id="rd-max-tokens" value="128" min="16" max="512" step="16" /></label>
              <span class="rd-flex"></span>
              <button class="rd-btn rd-dark" id="rd-btn-generate">发送</button>
            </div>
          </div>

          <div class="rd-card" id="rd-context-card" style="display:none">
            <p class="rd-label">上下文（CAD 冲突实验用，可留空）</p>
            <textarea id="rd-context" rows="2" placeholder="例如：阿根廷在 1978、1986 和 2022 年赢得了世界杯。"></textarea>
          </div>
        </section>

        <!-- 右上：方法选择 -->
        <aside class="rd-panel rd-panel-side">
          <div id="rd-methods"></div>
          <button class="rd-btn rd-dark rd-run" id="rd-btn-run">开始检测 / 缓解</button>
          <p class="rd-hint" id="rd-run-hint">先在左侧发送提示词，再选择方法运行。</p>
        </aside>

        <!-- 右下：参数设置（抽样 + 方法参数） -->
        <section class="rd-panel rd-panel-params">
          <p class="rd-panel-title">参数设置</p>
          <p class="rd-label rd-params-for" id="rd-params-for" hidden></p>
          <div class="rd-card" id="rd-sampling" style="display:none">
            <p class="rd-label" id="rd-sampling-title">抽样</p>
            <div class="rd-row">
              <label class="rd-inline">样本数 <input type="number" id="rd-num-samples" min="2" max="10" step="1" placeholder="5" /></label>
              <label class="rd-inline" id="rd-layer-wrap" style="display:none">隐状态层 <input type="number" id="rd-hidden-layer" step="1" placeholder="-1" /></label>
              <button class="rd-btn" id="rd-btn-sample">抽样</button>
            </div>
          </div>
          <div id="rd-params" class="rd-params"></div>
        </section>

        <!-- 下方：输出结果（抽样出的独立回答） -->
        <section class="rd-panel rd-panel-samples">
          <p class="rd-panel-title">输出结果</p>
          <div id="rd-samples" class="rd-samples-empty">尚未抽样。</div>
        </section>

        <!-- 最下：检测结果 -->
        <section class="rd-panel rd-panel-result">
          <p class="rd-panel-title">检测结果</p>
          <div class="rd-result-empty" id="rd-result-empty">选择右侧方法并填写参数后点击运行，检测结果展示在这里。</div>
          <div id="rd-result" class="rd-result" style="display:none"></div>
        </section>
      </main>

      <footer class="footer"><span>Signal Desk</span><span>真实后端 · 结果与 toolkit CLI 完全一致</span></footer>
    </div>

    <script src="real.js"></script>
  </body>
</html>
