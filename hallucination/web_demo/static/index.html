<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Desk | 幻觉检测与缓解工作台（真后端）</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="real.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="mode-tabs" aria-label="实验模式">
        <span class="mode-tabs-label">选择模式</span>
        <button id="mode-demo" class="mode-tab active" type="button" aria-pressed="true"><span>01</span>预设回放<small>离线 · 不加载模型</small></button>
        <button id="mode-live" class="mode-tab" type="button" aria-pressed="false"><span>02</span>实时模型<small id="live-mode-status">检查连接中</small></button>
        <p id="mode-description">浏览已保存的教学记录；切换到实时模型后，才会提交新的实验。</p>
      </nav>

      <main class="tut-shell">
        <!-- 左上：模型问答（跨两行；高度只跟随右侧两框，消息多了列表内部滚动） -->
        <section class="rd-panel rd-panel-chat">
          <div class="rd-chat-body">
            <p class="rd-panel-title">模型问答</p>
            <div class="rd-msglist" id="rd-msglist">
              <div class="rd-empty">
                <p class="rd-empty-title">你好，这里是幻觉演示助手</p>
                <p class="rd-empty-sub">点击「+」选择预设问题发送，或在输入框输入提示词</p>
              </div>
            </div>

            <div class="rd-card" id="rd-context-card" style="display:none">
              <p class="rd-label">上下文</p>
              <textarea id="rd-context" rows="2" placeholder="例如：阿根廷在 1978、1986 和 2022 年赢得了世界杯。"></textarea>
              <p class="rd-hint" id="rd-context-hint"></p>
            </div>

            <div class="rd-inputbar">
              <button class="rd-plus" id="rd-btn-preset" type="button" aria-label="选择预设提示词" aria-expanded="false">+</button>
              <textarea id="rd-prompt" rows="1" placeholder="输入提示词，发送后模型开始回答…"></textarea>
              <button class="rd-send" id="rd-btn-generate" type="button" aria-label="发送">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4m0 0-5 5m5-5 5 5" /></svg>
              </button>
              <div class="rd-popover" id="rd-preset-popover" hidden>
                <p class="rd-popover-title">预设提示词</p>
                <div id="rd-preset-list"></div>
                <div class="rd-popover-field">
                  <label class="rd-inline">生成长度 <input type="number" id="rd-max-tokens" value="512" min="16" max="1024" step="16" /></label>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 右上：方法选择（大类为可折叠分组，展开后是小分类与方法列表） -->
        <aside class="rd-panel rd-panel-side">
          <p class="rd-panel-title">选择方法</p>
          <div id="rd-methods"></div>
          <a id="rd-paper-link" target="_blank" rel="noopener" hidden></a>
          <button class="rd-btn rd-dark rd-run" id="rd-btn-run">开始检测 / 缓解</button>
          <p class="rd-hint" id="rd-run-hint">先在左侧发送提示词，再选择方法运行。</p>
        </aside>

        <!-- 右下：参数设置（高度固定为参数最多方法的长度） -->
        <section class="rd-panel rd-panel-params">
          <p class="rd-panel-title">参数设置</p>
          <div id="rd-sampling" style="display:none">
            <label class="field field-num">样本数 <input type="number" id="rd-num-samples" min="2" max="10" step="1" placeholder="5" /></label>
            <label class="field field-num" id="rd-layer-wrap" style="display:none">隐状态层 <input type="number" id="rd-hidden-layer" step="1" placeholder="-1" /></label>
            <button class="rd-btn rd-dark rd-run" id="rd-btn-sample">抽样</button>
          </div>
          <div id="rd-params" class="rd-params"></div>
        </section>

        <!-- 下方：输出结果（抽样出的独立回答；仅需要抽样的方法显示） -->
        <section class="rd-panel rd-panel-samples" id="rd-samples-panel" hidden>
          <p class="rd-panel-title">输出结果</p>
          <div id="rd-samples" class="rd-samples-empty">尚未抽样。</div>
        </section>

        <!-- 最下：检测结果（按回答保存，标签切换同一条回答的不同方法结果） -->
        <section class="rd-panel rd-panel-result">
          <p class="rd-panel-title">检测结果</p>
          <div class="rd-result-tabs" id="rd-result-tabs" hidden></div>
          <div class="rd-result-empty" id="rd-result-empty">选择方法并运行后，检测结果展示在这里。</div>
          <div id="rd-result" class="rd-result" style="display:none"></div>
        </section>
      </main>
    </div>

    <script src="real.js"></script>
    <script src="mode.js"></script>
  </body>
</html>
