[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hallucination-toolkit"
version = "0.1.0"
description = "Book-companion toolkit for LLM hallucination detection and inference-time mitigation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Toolkit Hallucination Contributors" }]
keywords = [
    "llm",
    "hallucination",
    "hallucination-detection",
    "hallucination-mitigation",
    "factuality",
    "semantic-entropy",
    "selfcheck",
    "factscore",
    "dola",
    "context-aware-decoding",
    "iti",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "typing-extensions>=4.8",
]

[project.urls]
Homepage = "https://github.com/StellaZYing/hallucination"
Repository = "https://github.com/StellaZYing/hallucination"
Issues = "https://github.com/StellaZYing/hallucination/issues"
Changelog = "https://github.com/StellaZYing/hallucination/blob/main/CHANGELOG.md"

[project.scripts]
hallucination-detection = "hallucination.detection.cli:main"
hallucination-mitigation = "hallucination.mitigation.cli:main"

[project.optional-dependencies]
# detection extras
embeddings = ["sentence-transformers>=3.0", "scikit-learn>=1.4"]
whitebox = ["torch>=2.1", "transformers>=4.45"]
nli = ["torch>=2.1", "transformers>=4.45"]
selfcheck-bertscore = ["bert-score>=0.3"]
calibration = ["scikit-learn>=1.4"]
dataframe = ["pandas>=2.0"]
# mitigation extras
hf = ["torch>=2.1", "transformers>=4.45", "accelerate>=0.30", "safetensors>=0.4", "huggingface-hub>=0.24"]
pca = ["scikit-learn>=1.3"]
iti = ["scikit-learn>=1.3"]
quant = ["bitsandbytes>=0.43"]
# shared extras
openai = ["openai>=1.0"]
datasets = ["datasets>=2.18"]
plots = ["matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
]
all = [
    "torch>=2.1",
    "transformers>=4.45",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "bert-score>=0.3",
    "openai>=1.0",
    "datasets>=2.18",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real API or model downloads; not run by default",
    "slow: slow tests",
]

[tool.ruff]
# Tutorial notebooks and local run artifacts keep their own import order and
# are not lint targets; lint shipped code only.
extend-exclude = ["examples", "runs", "docs-archive", ".pytest_tmp*", "pytest-of-*"]

[tool.ruff.lint]
# Keep in sync with CI. E501 is deliberately not selected: long lines are
# intentional throughout (long Chinese prompts and report strings).
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
