name: Verify toolkit and demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[api,dev]"
      - run: pytest -q
  webpage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: webpage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webpage/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
