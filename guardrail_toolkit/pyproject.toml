[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-toolkit"
version = "0.1.0"
description = "Inspectable YuFeng-XGuard input and output safety checks with a local web UI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.5", "transformers>=4.51,<6", "accelerate>=1", "huggingface-hub>=0.30"]
test = ["pytest>=8"]

[project.scripts]
guardrail-web = "guardrail_toolkit.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrail_toolkit = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
