[metadata]
name = llm-textbook-toolkit
version = 0.2.0
description = Composable Python methods for an LLM safety textbook
long_description = file: README.md
long_description_content_type = text/markdown
license_files = THIRD_PARTY_NOTICES.md

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
textbook_toolkit = py.typed

[options.extras_require]
optimization =
    torch>=2.2,<3
    transformers>=4.45,<5
    numpy>=1.26,<3
    sentencepiece>=0.2
dev =
    ruff>=0.11
evolution =
    nltk>=3.8,<4
